name = "ClusterAlgebras"
defaultTargets = ["ClusterAlgebras"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

# Mathlib's standard linter set.
weak.linter.mathlibStandardSet = true

# Our Mathlib (b476d8fd31), Lean v4.36.0.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "b476d8fd31a353258f27f2e35e8e25b689d6a052"

[[lean_lib]]
name = "ClusterAlgebras"

# The comparator pair. Deliberately NOT in defaultTargets: `Challenge` carries a
# permanent `sorry` (its statements are the artifact), and `lake lint` derives its
# scope from the default targets. The comparator builds both modules itself.
[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
